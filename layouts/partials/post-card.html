<article class="post-card">
  <a href="{{ .Permalink }}" class="post-card-link">
    <h2 class="post-card-title">{{ .Title }}</h2>
    <div class="post-card-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format ($.Site.Params.dateFormat | default "Jan 2, 2006") }}</time>
      {{- with .Params.tags }}
      <span class="post-card-tags">
        {{- range first 3 . }}
        <span class="tag">{{ . }}</span>
        {{- end }}
      </span>
      {{- end }}
    </div>
    {{- with .Description }}
    <p class="post-card-summary">{{ . }}</p>
    {{- else }}
    {{- if .Summary }}
    <p class="post-card-summary">{{ .Summary | plainify | truncate 160 }}</p>
    {{- end }}
    {{- end }}
  </a>
</article>
