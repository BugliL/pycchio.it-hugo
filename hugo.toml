baseURL = 'https://example.org/'
languageCode = 'en-us'
title = 'Pycchio.it'

[module]
  [[module.imports]]
    path = "github.com/vaga/hugo-theme-m10c"

[pagination]
  pagerSize = 8

[menu]

  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 2

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 3

[params]
  author = "Lorenzo Bugli"
  description = "Software engineer sharing knowledge and experiences."
  menu_item_separator = " - "

  [[params.social]]
    icon = "brand-github"
    name = "Github"
    url = "https://github.com/BugliL"

  [[params.social]]
    icon = "brand-linkedin"
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/buglil"

# Default theme
[params.style]
  darkestColor = "#242930"
  darkColor = "#353b43"
  lightColor = "#afbac4"
  lightestColor = "#ffffff"
  primaryColor = "#578acc"

